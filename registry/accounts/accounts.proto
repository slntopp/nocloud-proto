syntax = "proto3";

package nocloud.registry.accounts;

import "access/access.proto";
import "billing/billing.proto";
import "google/protobuf/struct.proto";
import "notes/notes.proto";

message InvoiceOrderSettings {
  string template = 1;
  string new_template = 2;
  int64  start_with_number = 3;
  string reset_counter_mode = 4;
}

message InvoiceParametersCustom {
  string invoice_from = 1;
  string logo_url = 2;
}

message AccountGroup{
  string uuid = 1;
  string title = 2;
  string color = 3;

  bool   has_own_invoice_order = 5;
  InvoiceOrderSettings invoice_order_settings = 6; // Active only if has_own_invoice_order == true. Otherwise, inherited from nocloud invoice settings
  bool has_own_invoice_base = 7;
  InvoiceParametersCustom invoice_parameters_custom = 8; // Active only if has_own_invoice_base == true. Otherwise, inherited from nocloud invoice settings
}

message Credentials {
  string type = 1;
  repeated string data = 2;
}

message CreateRequest {
  string title = 1;          // New Account title
  Credentials auth = 2;      // Credentials for New Account
  string namespace = 3;      // Namespace to put Account under
  optional int32 access = 4; // Account access level to parent namespace
  nocloud.billing.Currency currency = 5; // Account Balance Currency
  google.protobuf.Struct data = 6;
  string account_owner = 7; // Mother account of this account. If != "" - then this account is gonna be subaccount
}

message CreateResponse {
  string uuid = 1;
  string namespace = 2;
}

message GetRequest {
  string uuid = 1;
  bool public = 2;
}

message SuspendConf {
  optional bool immune = 1;
  optional float limit = 2;
}

enum AccountStatus {
  ACTIVE = 0;
  LOCK = 1;
  PERMANENT_LOCK = 2;
}

message Account {
  string uuid = 1;
  string title = 2;

  google.protobuf.Struct data = 3;

  optional double balance = 4;
  optional nocloud.access.Access access = 5;
  optional SuspendConf suspend_conf = 6;
  optional bool suspended = 7;
  optional nocloud.billing.Currency currency = 8; // Account Balance Currency
  AccountStatus status = 9;
  repeated notes.AdminNote admin_notes = 10;
  bool active = 11;

  repeated string subaccounts = 12; // List of UUID's of sub-accounts of this account
  string account_owner = 13;        // Mother account of this account. If != "" - then this account is subaccount

  string paymentsGateway = 14;

  bool is_email_verified = 15;
  bool is_phone_verified = 16;

  AccountMeta meta = 17;

  string language_code = 18;

  string account_group = 19;
}

message AccountMeta {
   Notifications notifications = 1;
}

message Notifications {
   BalanceNotification first_balance_notify = 1;
   BalanceNotification second_balance_notify = 2;
}

message BalanceNotification {
  AccountNotification base = 1;
  optional bool invalidated = 2;
  optional double threshold = 3;
}

message AccountNotification {
  optional bool  disabled = 1;
  int64 last_notification = 2;
  int64 sent_notifications = 3;
}

message UpdateResponse {bool result = 1;}

message ListRequest {
  optional string namespace = 1; // Namespace ID to seek account in
  optional int32 depth = 2;      // Depth
  optional uint64 page = 3;
  optional uint64 limit = 4;
  optional string field = 5;
  optional string sort = 6;
  map<string, google.protobuf.Value> filters = 7;
}

message ListResponse {
  repeated Account pool = 1;
  int64 count = 2;
  int64 active = 3;
}

message SetCredentialsRequest {
  string account = 1;
  Credentials auth = 2;
}

message SetCredentialsResponse {bool result = 1;}

message TokenRequest {
  Credentials auth = 1;
  int32 exp = 2;
  bool root_claim = 3;
  string sp_claim = 4;
  string instance_claim = 5;
  optional string uuid = 6;
}

message TokenResponse {string token = 1;}

message DeleteRequest {string uuid = 1;}

message DeleteResponse {bool result = 1;}

message SuspendRequest {string uuid = 1;}

message SuspendResponse {bool result = 1;}

message UnsuspendRequest {string uuid = 1;}

message UnsuspendResponse {bool result = 1;}

message Phone {
  string country_code = 1;
  string number = 2;
}
message ChangePhoneRequest {
   Phone new_phone = 1;
}

message ChangePhoneResponse {bool result = 1;}

message ChangeLanguageCodeRequest {
  string language_code = 1;
  optional string target_account = 2;
}

message ChangeLanguageCodeResponse {}

message AccountGroupsListResponse {
  repeated AccountGroup pool = 1;
  int64 count = 2;
}