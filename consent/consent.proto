syntax = "proto3";
package nocloud.consent;

import "google/api/annotations.proto";

enum Decision {
  DECISION_UNSPECIFIED = 0;
  ACCEPT = 1;
  DECLINE = 2;
}

message RecordRequest {
  Decision decision = 1;
  repeated string categories = 2;
  string policy_version = 3;
}

message RecordResponse { string uuid = 1; }

message Record {
  string uuid = 1;
  optional string account = 2;
  Decision decision = 3;
  repeated string categories = 4;
  string policy_version = 5;
  string ip = 6;
  string user_agent = 7;
  int64 created_at = 8;
  string domain = 9;
}

message ListRequest {
  optional string account = 1;
  optional int64 page = 2;
  optional int64 limit = 3;
  optional string domain = 4;
}

message ListResponse { repeated Record pool = 1; }

service ConsentService {
  rpc Record(nocloud.consent.RecordRequest) returns (nocloud.consent.RecordResponse) {
    option (google.api.http) = {
      post : "/consent"
      body : "*"
    };
  };
  rpc List(nocloud.consent.ListRequest) returns (nocloud.consent.ListResponse) {
    option (google.api.http) = {
      get : "/consent"
    };
  };
}
